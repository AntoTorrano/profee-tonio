<script>
const NS = "http://www.w3.org/2000/svg", g = document.getElementById("g");
const el = (t, a) => { const e = document.createElementNS(NS, t); for (const k in a) e.setAttribute(k, a[k]); g.appendChild(e); return e; };
const X_HUECO = 1260, y = x => 770 - 330 * Math.exp(-(((x - 1180) / 260) ** 2)) - (x - 80) * 0.02;
const tramo = (a, b) => { let d = ""; for (let x = a; x <= b; x += 4) d += (x === a ? "M" : " L") + x + " " + y(x).toFixed(1); return d; };
el("line", { x1: 60, y1: 790, x2: 1380, y2: 790, stroke: "#7C93C7", "stroke-opacity": .3, "stroke-width": 1.5 });
for (const d of [tramo(80, X_HUECO - 14), tramo(X_HUECO + 14, 1380)]) {
  el("path", { d, fill: "none", stroke: "#2E78FF", "stroke-width": 9, "stroke-opacity": .55, filter: "url(#h)" });
  el("path", { d, fill: "none", stroke: "#7FB6FF", "stroke-width": 3 });
}
// el punto que falta: círculo abierto
el("circle", { cx: X_HUECO, cy: y(X_HUECO), r: 11, fill: "#04060D", stroke: "#FFE14D", "stroke-width": 3 });
el("line", { x1: X_HUECO, y1: y(X_HUECO) + 18, x2: X_HUECO, y2: 790, stroke: "#FFE14D", "stroke-opacity": .5, "stroke-dasharray": "5 6" });
</script>
